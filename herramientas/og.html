<!doctype html>
<!-- Generador de public/og.png (1200x630). Se abre en Edge headless y se captura; ver herramientas/og.mjs -->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Bricolage'; font-weight: 200 800; src: url('../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wght-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Instrument'; font-weight: 400 700; src: url('../node_modules/@fontsource-variable/instrument-sans/files/instrument-sans-latin-wght-normal.woff2') format('woff2'); }
  @font-face { font-family: 'JBMono'; font-weight: 100 800; src: url('../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2') format('woff2'); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #161b26; }
  .og { position: relative; width: 1200px; height: 630px; color: #d7dce4; font-family: 'Instrument', sans-serif; overflow: hidden;
    background: radial-gradient(620px 520px at 78% 52%, rgb(255 122 69 / 0.13), transparent 70%), #161b26; }
  .grid { position: absolute; inset: 0;
    background: radial-gradient(circle, rgb(215 220 228 / 0.20) 1.2px, transparent 1.8px) 0 0 / 28px 28px;
    -webkit-mask-image: radial-gradient(ellipse 60% 85% at 76% 50%, #000 10%, transparent 72%); mask-image: radial-gradient(ellipse 60% 85% at 76% 50%, #000 10%, transparent 72%); }
  .laptop { position: absolute; right: -70px; top: 50%; width: 760px; transform: translateY(-50%); mix-blend-mode: lighten; -webkit-mask-image: radial-gradient(ellipse 50% 56% at 50% 52%, #000 62%, transparent 100%); mask-image: radial-gradient(ellipse 50% 56% at 50% 52%, #000 62%, transparent 100%); }
  .left { position: absolute; left: 72px; top: 0; bottom: 0; width: 600px; display: flex; flex-direction: column; justify-content: center; }
  .eyebrow { font: 500 20px/1 'JBMono', monospace; letter-spacing: 0.1em; text-transform: uppercase; color: #aab1bd; display: flex; align-items: center; gap: 14px; margin-bottom: 30px; }
  .eyebrow::before { content: ''; width: 34px; height: 3px; border-radius: 3px; background: linear-gradient(90deg, #ff7a45, #ff3d7f); }
  h1 { font: 800 86px/1.0 'Bricolage', sans-serif; letter-spacing: -0.02em; margin-bottom: 34px; }
  h1 span { display: block; background: linear-gradient(90deg, #ff7a45, #ff3d7f); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: 8px; }
  .role { font: 500 30px/1.3 'Instrument', sans-serif; color: #d7dce4; }
  .brand { position: absolute; left: 72px; bottom: 52px; font: 700 26px/1 'Bricolage', sans-serif; letter-spacing: -0.01em; }
  .brand i { font-style: normal; font-weight: 800; background: linear-gradient(90deg, #ff7a45, #ff3d7f); -webkit-background-clip: text; background-clip: text; color: transparent; }
</style>
</head>
<body>
<div class="og">
  <div class="grid"></div>
  <img class="laptop" src="../blender/renders/armado.png" alt="" />
  <div class="left">
    <p class="eyebrow">Portfolio</p>
    <h1>Juan Nicolás <span>García</span></h1>
    <p class="role">Full-stack engineer<span style="margin:0 0.5em;opacity:0.5">·</span>AI &amp; Web3</p>
  </div>
  <p class="brand">nicolasgarc<i>IA</i></p>
</div>
</body>
</html>
